packages:
  - "apps/*"

# pnpm 11 exige aprobar los paquetes que ejecutan scripts de instalacion.
# Ambos son parte del toolchain oficial de Next.js:
#   sharp         -> optimizacion de imagenes de next/image (RNF-03, WebP)
#   unrs-resolver -> resolvedor de modulos de eslint-config-next
allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
