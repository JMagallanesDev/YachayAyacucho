# ============================================================
#  Yachay Ayacucho - configuracion del backend
# ============================================================
#  Ningun secreto vive en este archivo (RNF-17). Todos los valores
#  sensibles se leen del .env unico de la raiz del monorepo, que se
#  importa abajo, o de las variables de entorno del proveedor cloud
#  (Railway / Fly.io) cuando el .env no existe.
# ============================================================

spring:
  application:
    name: yachay-api

  # El perfil activo se declara aqui de forma explicita.
  #
  # No basta con tener SPRING_PROFILES_ACTIVE en el .env: esa forma en
  # mayusculas solo la reconoce Spring cuando llega como variable de entorno
  # real del sistema. Leida desde un archivo de propiedades es una clave mas,
  # sin relacion con spring.profiles.active, y el perfil quedaba sin activar
  # en silencio.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ----------------------------------------------------------
  #  Carga del .env unico de la raiz del proyecto.
  #  La pista [.properties] le dice a Spring que lea el archivo
  #  como pares CLAVE=valor. Las dos rutas cubren los dos modos
  #  de arranque: desde la raiz (jar) y desde apps/api (mvnw).
  #  `optional:` evita que la app muera si el archivo no existe,
  #  que es justo el caso en produccion.
  # ----------------------------------------------------------
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../../.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: YachayHikariPool
      # Con virtual threads el pool es el limite real de concurrencia.
      # 10 es holgado para desarrollo; se dimensiona contra la
      # capacidad de PostgreSQL al desplegar.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      leak-detection-threshold: 20000

  data:
    redis:
      url: ${REDIS_URL}
      timeout: 2s
      connect-timeout: 2s
      # Con Spring Data JPA y Spring Data Redis a la vez en el classpath,
      # Spring intenta adivinar a que motor pertenece cada repositorio y
      # emite un aviso por cada uno que no puede clasificar: unos 40 al
      # arrancar. Aqui no existe ningun repositorio de Redis —la cache y el
      # rate limiting usan StringRedisTemplate directamente—, asi que se
      # desactiva su escaneo. Ademas de silenciar el ruido, acelera el
      # arranque y evita que un repositorio JPA acabe asignado por error.
      repositories:
        enabled: false

  # ----------------------------------------------------------
  #  JPA / Hibernate
  # ----------------------------------------------------------
  jpa:
    # El esquema lo manda Flyway, nunca Hibernate. `none` evita que
    # Hibernate toque la estructura por su cuenta.
    hibernate:
      ddl-auto: none
    # Obligatorio (CLAUDE.md): con open-in-view la sesion sigue abierta
    # durante el render y las consultas perezosas se disparan fuera del
    # service, que es la receta clasica del problema N+1 invisible.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        # Falla al arrancar si una consulta pagina en memoria en vez de
        # en la BD: con 35 entidades es un error facil de cometer.
        query:
          fail_on_pagination_over_collection_fetch: true

  # ----------------------------------------------------------
  #  Flyway: migraciones versionadas del esquema
  # ----------------------------------------------------------
  #  Se aplican solas al arrancar la aplicacion. Nunca se edita una
  #  migracion ya aplicada: se crea la siguiente.
  # ----------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  # Virtual threads de Java 21: el backend es I/O-bound (BD, Redis,
  # APIs externas), que es exactamente su caso de uso ideal.
  threads:
    virtual:
      enabled: true

  # ----------------------------------------------------------
  #  Subida de archivos (Bloque 6, RNF-15)
  # ----------------------------------------------------------
  #  Primera barrera de las tres: Tomcat rechaza el archivo antes de que
  #  llegue a la aplicacion, de modo que un envio de 500 MB no consume
  #  memoria ni tiempo. Las otras dos —firma de bytes y decodificacion
  #  real— viven en ValidadorImagen.
  servlet:
    multipart:
      max-file-size: 5MB
      # Algo mayor que el archivo: el multipart lleva ademas las cabeceras
      # de cada parte, y ajustarlo al milimetro rechazaria imagenes de
      # exactamente 5 MB que si deberian pasar.
      max-request-size: 6MB

server:
  port: 8080
  # Todo el API cuelga de /api/v1 (RNF-28). Los controllers solo
  # declaran su ruta propia: /health -> /api/v1/health
  servlet:
    context-path: /api/v1
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # ----------------------------------------------------------
  #  Seguridad (Bloque 2)
  # ----------------------------------------------------------
  seguridad:
    jwt-secret: ${JWT_SECRET}
    # Access token corto a proposito: un JWT no se puede revocar, asi que
    # cuanto menos viva, menos dura una filtracion. La rotacion del refresh
    # permite que el usuario no note la diferencia.
    access-expiration: ${JWT_EXPIRATION:900000}ms
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}ms
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAMESITE:Lax}
    proxies-confiables: ${PROXIES_CONFIABLES:127.0.0.1/32,::1/128}
    emisor: yachay-ayacucho
    # Secreto con el que el servidor de Next se identifica ante el API para
    # quedar exento del rate limiting durante el prerenderizado (Bloque 13).
    # Vacio por defecto: sin el, no se exime a nadie. NUNCA lleva prefijo
    # NEXT_PUBLIC_, porque entonces viajaria al navegador.
    token-interno: ${YACHAY_TOKEN_INTERNO:}

  admin:
    # Solo se usa en perfil dev, para dar acceso al admin del seed sin
    # dejar ningun hash de contrasena conocida en el repositorio.
    password-inicial: ${ADMIN_PASSWORD_INICIAL:}

  # ----------------------------------------------------------
  #  Revalidacion ISR bajo demanda (seccion 5.5)
  # ----------------------------------------------------------
  #  Al guardar un lugar, el backend avisa a Next.js para que regenere
  #  su pagina. Si estas dos variables estan vacias, el aviso se omite
  #  sin ruido: en un entorno sin frontend levantado no hay a quien
  #  avisar, y el guardado debe funcionar igual.
  revalidacion:
    url: ${REVALIDATE_WEBHOOK_URL:}
    secreto: ${REVALIDATE_SECRET:}

  # Refresco de la vista materializada EstadisticaLugar (seccion 6.3 del
  # plan): cada 5 minutos, con lock distribuido en Redis para que N
  # instancias del backend no lo ejecuten a la vez.
  estadisticas:
    refresco-cron: "0 */5 * * * *"
    lock-maximo: PT4M
    lock-minimo: PT30S
    # Carril rapido (Bloque 6): al dejar o moderar una resena, el promedio se
    # recalcula en 30 s como mucho en vez de esperar al ciclo de 5 minutos. Sin
    # esto, quien punt�a un lugar no ve moverse la nota y vuelve a puntuar.
    intervalo-carril-rapido: PT30S

# ----------------------------------------------------------
#  Cloudinary (Bloque 6, RF-38)
# ----------------------------------------------------------
#  Una sola variable con las tres credenciales, en el formato que
#  entrega el propio panel de Cloudinary. El api_secret NUNCA sale del
#  backend: solo se usa para firmar. Si esta vacia, la subida responde
#  503 y el resto de la aplicacion funciona igual.
cloudinary:
  url: ${CLOUDINARY_URL:}
  carpeta-base: yachay-ayacucho

# ----------------------------------------------------------
#  Clima (Bloque 5, RF-25 a RF-27)
# ----------------------------------------------------------
#  La clave de OpenWeatherMap NO lleva prefijo NEXT_PUBLIC_ a proposito:
#  se queda en el servidor y el navegador nunca la ve. Si esta vacia, el
#  modulo responde "no disponible" y el resto de la aplicacion sigue
#  funcionando; asi el proyecto arranca sin necesidad de una cuenta.
clima:
  api-key: ${OPENWEATHER_API_KEY:}
  url-base: https://api.openweathermap.org
  # Plaza Mayor de Huamanga.
  latitud: -13.1588
  longitud: -74.2236
  # Fresco: cada cuanto se vuelve a preguntar (RF-25).
  ttl-fresco: PT30M
  # Ultimo bueno: red de seguridad ante una caida del proveedor. Es mucho
  # mas largo a proposito; su trabajo no es ahorrar llamadas sino que
  # siempre haya algo que mostrar.
  ttl-ultimo-bueno: PT24H
  timeout: PT3S

logging:
  level:
    com.huamanga.tourism: INFO
