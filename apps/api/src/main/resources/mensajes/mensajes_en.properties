# API error titles and details (ProblemDetail, RFC 7807)

error.credenciales-invalidas.titulo=Invalid credentials
error.credenciales-invalidas.detalle=The email or password is incorrect.

error.sesion-expirada.titulo=Invalid session
error.sesion-expirada.detalle=Your session has expired. Please sign in again.

error.email-registrado.titulo=Email already registered
error.email-registrado.detalle=An account with that email already exists.

error.validacion.titulo=Invalid data
error.validacion.detalle=Please review the highlighted fields.

error.no-encontrado.titulo=Not found
error.no-encontrado.detalle=The requested resource does not exist.

error.slug-duplicado.titulo=Identifier already in use
error.slug-duplicado.detalle=Another place already uses that URL identifier.

error.no-autenticado.titulo=Not authenticated
error.no-autenticado.detalle=You need to sign in to access this resource.

error.acceso-denegado.titulo=Access denied
error.acceso-denegado.detalle=Your account does not have permission to perform this action.

# --- Block 6: reviews and photos ---
error.resena-duplicada.titulo=You already reviewed this place
error.resena-duplicada.detalle=You can only leave one review per place. Edit the one you already wrote.
error.resena-ajena.titulo=Not your review
error.resena-ajena.detalle=You can only edit or delete reviews you wrote yourself.
error.limite-fotos.titulo=Photo limit reached
error.limite-fotos.detalle=You can upload up to 5 photos per place.
error.imagen-invalida.titulo=Invalid image
error.imagen-invalida.detalle=The file is not a valid image or exceeds the allowed size.
error.fotos-no-configuradas.titulo=Upload unavailable
error.fotos-no-configuradas.detalle=The photo service is not configured in this environment.
error.subida-fallida.titulo=Could not upload the photo
error.subida-fallida.detalle=The image service did not respond. Please try again in a few minutes.
error.demasiadas-peticiones.titulo=Too many operations
error.demasiadas-peticiones.detalle=You have created a lot of content in a short time. Please wait a moment.

# --- Block 7: check-in, passport and reports ---
error.demasiado-lejos.titulo=You are too far away
error.demasiado-lejos.detalle=Get closer to the place to register your visit.
error.precision-insuficiente.titulo=Imprecise GPS signal
error.precision-insuficiente.detalle=Your location is not accurate enough. Step outside and try again.
error.checkin-repetido.titulo=Visit already registered
error.checkin-repetido.detalle=You can register this place again in 24 hours.
error.salto-imposible.titulo=Implausible location
error.salto-imposible.detalle=The distance from your previous visit is not possible in the elapsed time.
error.reporte-duplicado.titulo=Already reported
error.reporte-duplicado.detalle=You can only report a piece of content once.
error.autorreporte.titulo=This is your own content
error.autorreporte.detalle=If you want to remove it, edit or delete it from your profile.

# --- Block 8: citizen reports ---
error.fuera-de-ayacucho.titulo=Location outside Ayacucho
error.fuera-de-ayacucho.detalle=Only incidents within the Ayacucho region can be reported.
error.limite-reportes.titulo=Report limit reached
error.limite-reportes.detalle=The maximum number of reports in 24 hours was reached. Try again tomorrow.
