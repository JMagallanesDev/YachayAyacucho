# Titulos y detalles de los errores del API (ProblemDetail, RFC 7807)

error.credenciales-invalidas.titulo=Credenciales invalidas
error.credenciales-invalidas.detalle=El correo o la contrasena no son correctos.

error.sesion-expirada.titulo=Sesion no valida
error.sesion-expirada.detalle=Tu sesion ha caducado. Vuelve a iniciar sesion.

error.email-registrado.titulo=Correo ya registrado
error.email-registrado.detalle=Ya existe una cuenta con ese correo.

error.validacion.titulo=Datos invalidos
error.validacion.detalle=Revisa los campos marcados.

error.no-encontrado.titulo=No encontrado
error.no-encontrado.detalle=El recurso solicitado no existe.

error.slug-duplicado.titulo=Identificador en uso
error.slug-duplicado.detalle=Ya existe otro lugar con ese identificador de URL.

error.no-autenticado.titulo=No autenticado
error.no-autenticado.detalle=Necesitas iniciar sesion para acceder a este recurso.

error.acceso-denegado.titulo=Acceso denegado
error.acceso-denegado.detalle=Tu cuenta no tiene permisos para realizar esta accion.

# --- Bloque 6: resenas y fotos ---
error.resena-duplicada.titulo=Ya opinaste aqui
error.resena-duplicada.detalle=Solo puedes dejar una resena por lugar. Edita la que ya escribiste.
error.resena-ajena.titulo=No es tu resena
error.resena-ajena.detalle=Solo puedes modificar o borrar las resenas que escribiste tu.
error.limite-fotos.titulo=Limite de fotos alcanzado
error.limite-fotos.detalle=Puedes subir hasta 5 fotos por lugar.
error.imagen-invalida.titulo=Imagen no valida
error.imagen-invalida.detalle=El archivo no es una imagen valida o supera el tamano permitido.
error.fotos-no-configuradas.titulo=Subida no disponible
error.fotos-no-configuradas.detalle=El servicio de fotos no esta configurado en este entorno.
error.subida-fallida.titulo=No se pudo subir la foto
error.subida-fallida.detalle=El servicio de imagenes no respondio. Intentalo de nuevo en unos minutos.
error.demasiadas-peticiones.titulo=Demasiadas operaciones
error.demasiadas-peticiones.detalle=Has creado mucho contenido en poco tiempo. Espera un momento.
