# Valores ficticios para que el contexto de Spring arranque en los tests
# sin depender del .env real ni de infraestructura levantada.
# Ni el DataSource ni Redis abren conexion mientras nadie los use.

# Flyway SI abre conexion al arrancar, asi que se desactiva por defecto.
# Los tests con Testcontainers lo reactivan en BasePostgis, apuntando ya al
# contenedor real.
spring.flyway.enabled=false
DATABASE_URL=jdbc:postgresql://localhost:5432/test
DATABASE_USER=test
DATABASE_PASSWORD=test
REDIS_URL=redis://localhost:6379
CORS_ALLOWED_ORIGINS=http://localhost:3000
